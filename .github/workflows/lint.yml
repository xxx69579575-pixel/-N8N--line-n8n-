name: Lint & Syntax Check

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check --select E,F,I --ignore E501,E402 .

      - name: AST syntax check
        run: |
          python - <<'EOF'
          import ast, sys, pathlib, json

          errors = []
          for path in pathlib.Path(".").rglob("*.py"):
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  errors.append({"file": str(path), "line": e.lineno, "msg": str(e)})

          if errors:
              print("Syntax errors found:")
              for err in errors:
                  print(f"  {err['file']}:{err['line']} - {err['msg']}")
              sys.exit(1)
          else:
              print("All .py files passed AST syntax check.")
          EOF
