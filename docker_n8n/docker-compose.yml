services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-qa-n8n
    restart: unless-stopped
    ports:
      - "5681:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - WEBHOOK_URL=https://quadruplication-satisfyingly-corrina.ngrok-free.dev
      - GENERIC_TIMEZONE=Asia/Taipei
      - TZ=Asia/Taipei
      # LINE Messaging API
      - LINE_CHANNEL_ACCESS_TOKEN=zfUhwyDkW+q8PbPReXde6cN7d5g0EDaoRLiJN5q8x1mw15Sy4M19MqZRafcrheFOUfu+26krT110NoFELUjJWgB5pSnzRzoOh8w9oJu75Fzcnx126tN0gS1te8GtRzxkiFqHC6zmAFvfDuCFMaR/0gdB04t89/1O/w1cDnyilFU=
      - LINE_CHANNEL_SECRET=78c4e44968cfc0353a7bd41e1d69c4cc
      # Ollama — host machine
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_CHAT_MODEL=qwen2.5:7b-instruct-q4_0
      # PostgreSQL — 直連 docker 內部網路（見檔案下方 networks 說明）
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=vectordb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpwd
    volumes:
      - n8n_data:/home/node/.n8n
      - D:/n8n/CLAUDE 實做/本地AI企業問答助理:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - pgnet

networks:
  # PostgreSQL 跑在另一個 compose project（docker_postgresql）。接上它的網路後，
  # n8n 可用 db:5432 直連；否則只能繞 host.docker.internal:65432，
  # 走 Docker Desktop 的 port-forward —— 該層會回收閒置 TCP 連線，
  # 導致 n8n 的 pg pool 重用到死連線並拋 "Connection terminated unexpectedly"
  # （2026-09-01 執行 4265 / 4267 即此因）。
  pgnet:
    name: docker_postgresql_default
    external: true

volumes:
  n8n_data:
